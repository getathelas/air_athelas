<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="492" viewBox="0 0 1280 492" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="1280" height="492" fill="#FFFFFF"/><text x="48" y="58" font-size="25" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.3" >The cash formula</text><text x="48" y="83" font-size="14" fill="#8A9AA6" font-weight="400" text-anchor="start" letter-spacing="0" >Every dollar that reaches your bank is in one of these buckets on the last day of the month.</text><rect x="48" y="130" width="196" height="276" rx="16" fill="#DCF3E3"/><text x="72" y="168" font-size="11" fill="#15803D" font-weight="700" text-anchor="start" letter-spacing="1.4" >WHAT HIT THE BANK</text><text x="72" y="222" font-size="44" fill="#15803D" font-weight="800" text-anchor="start" letter-spacing="-1" >CASH</text><text x="72" y="256" font-size="13" fill="#2F6B45" font-weight="400" text-anchor="start" letter-spacing="0" >Total deposits for the</text><text x="72" y="274" font-size="13" fill="#2F6B45" font-weight="400" text-anchor="start" letter-spacing="0" >month, per your bank</text><text x="72" y="292" font-size="13" fill="#2F6B45" font-weight="400" text-anchor="start" letter-spacing="0" >statement.</text><line x1="72" y1="318" x2="220" y2="318" stroke="#15803D" stroke-width="1" opacity="0.28"/><text x="72" y="342" font-size="11" fill="#15803D" font-weight="700" text-anchor="start" letter-spacing="1.4" >SOURCE OF TRUTH</text><text x="72" y="364" font-size="13.5" fill="#2F6B45" font-weight="700" text-anchor="start" letter-spacing="0" >Bank statement</text><rect x="261.0" y="262.0" width="20" height="3" rx="1.5" fill="#8A9AA6"/><rect x="261.0" y="271.0" width="20" height="3" rx="1.5" fill="#8A9AA6"/><defs><clipPath id="clip1"><rect x="300" y="130" width="226" height="276" rx="16"/></clipPath></defs><rect x="300" y="130" width="226" height="276" rx="16" fill="#FFFFFF"/><rect x="300" y="130" width="226" height="6" fill="#B45309" clip-path="url(#clip1)"/><rect x="300" y="130" width="226" height="276" rx="16" fill="none" stroke="#E3E9ED" stroke-width="1.5"/><circle cx="334" cy="176" r="15" fill="#FCEFD6"/><text x="334" y="181" font-size="14" fill="#B45309" font-weight="800" text-anchor="middle" letter-spacing="0" >1</text><text x="320" y="218" font-size="16.5" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.2" >Unposted Payer</text><text x="320" y="239" font-size="16.5" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.2" >Money</text><text x="320" y="268" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >Payer cash in your bank that</text><text x="320" y="285" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >Athelas has not applied to a</text><text x="320" y="302" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >claim yet.</text><line x1="320" y1="340" x2="506" y2="340" stroke="#E3E9ED" stroke-width="1"/><text x="320" y="362" font-size="11" fill="#8A9AA6" font-weight="700" text-anchor="start" letter-spacing="1.4" >WHERE TO SEE IT</text><text x="320" y="382" font-size="12" fill="#B45309" font-weight="700" text-anchor="start" letter-spacing="0" >Bank Deposit Reconciliation</text><rect x="527.0" y="266.5" width="20" height="3" rx="1.5" fill="#8A9AA6"/><rect x="535.5" y="258.0" width="3" height="20" rx="1.5" fill="#8A9AA6"/><defs><clipPath id="clip2"><rect x="548" y="130" width="226" height="276" rx="16"/></clipPath></defs><rect x="548" y="130" width="226" height="276" rx="16" fill="#FFFFFF"/><rect x="548" y="130" width="226" height="6" fill="#4338CA" clip-path="url(#clip2)"/><rect x="548" y="130" width="226" height="276" rx="16" fill="none" stroke="#E3E9ED" stroke-width="1.5"/><circle cx="582" cy="176" r="15" fill="#E3E6FA"/><text x="582" y="181" font-size="14" fill="#4338CA" font-weight="800" text-anchor="middle" letter-spacing="0" >2</text><text x="568" y="218" font-size="16.5" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.2" >Unapplied and Free</text><text x="568" y="239" font-size="16.5" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.2" >Patient Credits</text><text x="568" y="268" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >Patient money you are</text><text x="568" y="285" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >holding that is not yet</text><text x="568" y="302" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >applied to an encounter, or</text><text x="568" y="319" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >can be refunded.</text><line x1="568" y1="340" x2="754" y2="340" stroke="#E3E9ED" stroke-width="1"/><text x="568" y="362" font-size="11" fill="#8A9AA6" font-weight="700" text-anchor="start" letter-spacing="1.4" >WHERE TO SEE IT</text><text x="568" y="382" font-size="12" fill="#4338CA" font-weight="700" text-anchor="start" letter-spacing="0" >Patient Credits</text><rect x="775.0" y="266.5" width="20" height="3" rx="1.5" fill="#8A9AA6"/><rect x="783.5" y="258.0" width="3" height="20" rx="1.5" fill="#8A9AA6"/><defs><clipPath id="clip3"><rect x="796" y="130" width="226" height="276" rx="16"/></clipPath></defs><rect x="796" y="130" width="226" height="276" rx="16" fill="#FFFFFF"/><rect x="796" y="130" width="226" height="6" fill="#0F766E" clip-path="url(#clip3)"/><rect x="796" y="130" width="226" height="276" rx="16" fill="none" stroke="#E3E9ED" stroke-width="1.5"/><circle cx="830" cy="176" r="15" fill="#D6F2EE"/><text x="830" y="181" font-size="14" fill="#0F766E" font-weight="800" text-anchor="middle" letter-spacing="0" >3</text><text x="816" y="218" font-size="16.5" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.2" >Applied Payments</text><text x="816" y="268" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >Payments matched and posted</text><text x="816" y="285" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >to a specific encounter. AR</text><text x="816" y="302" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >is relieved.</text><line x1="816" y1="340" x2="1002" y2="340" stroke="#E3E9ED" stroke-width="1"/><text x="816" y="362" font-size="11" fill="#8A9AA6" font-weight="700" text-anchor="start" letter-spacing="1.4" >WHERE TO SEE IT</text><text x="816" y="382" font-size="12" fill="#0F766E" font-weight="700" text-anchor="start" letter-spacing="0" >Encounter Revenue Activity</text><rect x="1023.0" y="266.5" width="20" height="3" rx="1.5" fill="#8A9AA6"/><rect x="1031.5" y="258.0" width="3" height="20" rx="1.5" fill="#8A9AA6"/><defs><clipPath id="clip4"><rect x="1044" y="130" width="226" height="276" rx="16"/></clipPath></defs><rect x="1044" y="130" width="226" height="276" rx="16" fill="#FFFFFF"/><rect x="1044" y="130" width="226" height="6" fill="#7E22CE" clip-path="url(#clip4)"/><rect x="1044" y="130" width="226" height="276" rx="16" fill="none" stroke="#E3E9ED" stroke-width="1.5"/><circle cx="1078" cy="176" r="15" fill="#F1E4FA"/><text x="1078" y="181" font-size="14" fill="#7E22CE" font-weight="800" text-anchor="middle" letter-spacing="0" >4</text><text x="1064" y="218" font-size="16.5" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.2" >Miscellaneous</text><text x="1064" y="239" font-size="16.5" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.2" >Payments</text><text x="1064" y="268" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >Non-claim money: products,</text><text x="1064" y="285" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >fees, programs, and payer</text><text x="1064" y="302" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >interest.</text><line x1="1064" y1="340" x2="1250" y2="340" stroke="#E3E9ED" stroke-width="1"/><text x="1064" y="362" font-size="11" fill="#8A9AA6" font-weight="700" text-anchor="start" letter-spacing="1.4" >WHERE TO SEE IT</text><text x="1064" y="382" font-size="12" fill="#7E22CE" font-weight="700" text-anchor="start" letter-spacing="0" >Misc Revenue Activity +</text><text x="1064" y="397" font-size="12" fill="#7E22CE" font-weight="700" text-anchor="start" letter-spacing="0" >Provider Adjustments</text><rect x="48" y="424" width="1184" height="52" rx="10" fill="#F7F9FA"/><text x="68" y="446" font-size="13" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="0" >Buckets 1 and 2 are cash received but not yet applied to a claim.</text><text x="68" y="465" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >Unapplied credits sit in your Unposted Money balance. Free credits never post against AR — they are booked as a patient refund liability.</text></svg>