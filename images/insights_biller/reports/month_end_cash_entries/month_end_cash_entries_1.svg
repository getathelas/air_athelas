<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="1280" height="540" fill="#FFFFFF"/><defs><marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2CDD4"/></marker></defs><text x="48" y="58" font-size="25" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.3" >The cash-basis life of a dollar</text><text x="48" y="83" font-size="14" fill="#8A9AA6" font-weight="400" text-anchor="start" letter-spacing="0" >Five entries carry a patient or payer dollar from the bank through revenue and, if it has to go back, out again. Every step passes through Unapplied Revenue.</text><defs><clipPath id="clip1"><rect x="48" y="132" width="218" height="292" rx="16"/></clipPath></defs><rect x="48" y="132" width="218" height="292" rx="16" fill="#FFFFFF"/><rect x="48" y="132" width="218" height="6" fill="#15803D" clip-path="url(#clip1)"/><rect x="48" y="132" width="218" height="292" rx="16" fill="none" stroke="#E3E9ED" stroke-width="1.5"/><circle cx="82" cy="180" r="16" fill="#15803D"/><text x="82" y="185" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0" >1</text><text x="68" y="224" font-size="16" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.2" >Collect cash</text><text x="68" y="274" font-size="12" fill="#8A9AA6" font-weight="400" text-anchor="start" letter-spacing="0" >Deposit lands in the bank</text><rect x="64" y="322" width="186" height="42" rx="8" fill="#F7F9FA"/><rect x="64" y="370" width="186" height="42" rx="8" fill="#F7F9FA"/><rect x="74" y="334" width="34" height="19" rx="9.5" fill="#DDE5EA"/><text x="91.0" y="347.1" font-size="10" fill="#5A6B78" font-weight="800" text-anchor="middle" letter-spacing="0.6" >DR</text><rect x="74" y="382" width="34" height="19" rx="9.5" fill="#DDE5EA"/><text x="91.0" y="395.1" font-size="10" fill="#5A6B78" font-weight="800" text-anchor="middle" letter-spacing="0.6" >CR</text><text x="116" y="342" font-size="11.5" fill="#0B1F2A" font-weight="600" text-anchor="start" letter-spacing="0" >Cash</text><text x="116" y="390" font-size="11.5" fill="#0B1F2A" font-weight="600" text-anchor="start" letter-spacing="0" >Unapplied Revenue</text><path d="M271 278.0 L283 278.0" stroke="#C2CDD4" stroke-width="2" fill="none" marker-end="url(#ah-g)" stroke-linecap="round"/><defs><clipPath id="clip2"><rect x="288" y="132" width="218" height="292" rx="16"/></clipPath></defs><rect x="288" y="132" width="218" height="292" rx="16" fill="#FFFFFF"/><rect x="288" y="132" width="218" height="6" fill="#0F766E" clip-path="url(#clip2)"/><rect x="288" y="132" width="218" height="292" rx="16" fill="none" stroke="#E3E9ED" stroke-width="1.5"/><circle cx="322" cy="180" r="16" fill="#0F766E"/><text x="322" y="185" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0" >2</text><text x="308" y="224" font-size="16" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.2" >Apply payment</text><text x="308" y="274" font-size="12" fill="#8A9AA6" font-weight="400" text-anchor="start" letter-spacing="0" >Athelas posts it to an</text><text x="308" y="290" font-size="12" fill="#8A9AA6" font-weight="400" text-anchor="start" letter-spacing="0" >encounter</text><rect x="304" y="322" width="186" height="42" rx="8" fill="#F7F9FA"/><rect x="304" y="370" width="186" height="42" rx="8" fill="#F7F9FA"/><rect x="314" y="334" width="34" height="19" rx="9.5" fill="#DDE5EA"/><text x="331.0" y="347.1" font-size="10" fill="#5A6B78" font-weight="800" text-anchor="middle" letter-spacing="0.6" >DR</text><rect x="314" y="382" width="34" height="19" rx="9.5" fill="#DDE5EA"/><text x="331.0" y="395.1" font-size="10" fill="#5A6B78" font-weight="800" text-anchor="middle" letter-spacing="0.6" >CR</text><text x="356" y="342" font-size="11.5" fill="#0B1F2A" font-weight="600" text-anchor="start" letter-spacing="0" >Unapplied Revenue</text><text x="356" y="390" font-size="11.5" fill="#0B1F2A" font-weight="600" text-anchor="start" letter-spacing="0" >Revenue</text><path d="M511 278.0 L523 278.0" stroke="#C2CDD4" stroke-width="2" fill="none" marker-end="url(#ah-g)" stroke-linecap="round"/><defs><clipPath id="clip3"><rect x="528" y="132" width="218" height="292" rx="16"/></clipPath></defs><rect x="528" y="132" width="218" height="292" rx="16" fill="#FFFFFF"/><rect x="528" y="132" width="218" height="6" fill="#B45309" clip-path="url(#clip3)"/><rect x="528" y="132" width="218" height="292" rx="16" fill="none" stroke="#E3E9ED" stroke-width="1.5"/><circle cx="562" cy="180" r="16" fill="#B45309"/><text x="562" y="185" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0" >3</text><text x="548" y="224" font-size="16" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.2" >Void payment</text><text x="548" y="274" font-size="12" fill="#8A9AA6" font-weight="400" text-anchor="start" letter-spacing="0" >Posting is reversed</text><rect x="544" y="322" width="186" height="42" rx="8" fill="#F7F9FA"/><rect x="544" y="370" width="186" height="42" rx="8" fill="#F7F9FA"/><rect x="554" y="334" width="34" height="19" rx="9.5" fill="#DDE5EA"/><text x="571.0" y="347.1" font-size="10" fill="#5A6B78" font-weight="800" text-anchor="middle" letter-spacing="0.6" >DR</text><rect x="554" y="382" width="34" height="19" rx="9.5" fill="#DDE5EA"/><text x="571.0" y="395.1" font-size="10" fill="#5A6B78" font-weight="800" text-anchor="middle" letter-spacing="0.6" >CR</text><text x="596" y="342" font-size="11.5" fill="#0B1F2A" font-weight="600" text-anchor="start" letter-spacing="0" >Revenue</text><text x="596" y="390" font-size="11.5" fill="#0B1F2A" font-weight="600" text-anchor="start" letter-spacing="0" >Unapplied Revenue</text><path d="M751 278.0 L763 278.0" stroke="#C2CDD4" stroke-width="2" fill="none" marker-end="url(#ah-g)" stroke-linecap="round"/><defs><clipPath id="clip4"><rect x="768" y="132" width="218" height="292" rx="16"/></clipPath></defs><rect x="768" y="132" width="218" height="292" rx="16" fill="#FFFFFF"/><rect x="768" y="132" width="218" height="6" fill="#4338CA" clip-path="url(#clip4)"/><rect x="768" y="132" width="218" height="292" rx="16" fill="none" stroke="#E3E9ED" stroke-width="1.5"/><circle cx="802" cy="180" r="16" fill="#4338CA"/><text x="802" y="185" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0" >4</text><text x="788" y="224" font-size="16" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.2" >Issue refund in</text><text x="788" y="245" font-size="16" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.2" >Athelas</text><text x="788" y="274" font-size="12" fill="#8A9AA6" font-weight="400" text-anchor="start" letter-spacing="0" >Credit is flagged</text><text x="788" y="290" font-size="12" fill="#8A9AA6" font-weight="400" text-anchor="start" letter-spacing="0" >refundable</text><rect x="784" y="322" width="186" height="42" rx="8" fill="#F7F9FA"/><rect x="784" y="370" width="186" height="42" rx="8" fill="#F7F9FA"/><rect x="794" y="334" width="34" height="19" rx="9.5" fill="#DDE5EA"/><text x="811.0" y="347.1" font-size="10" fill="#5A6B78" font-weight="800" text-anchor="middle" letter-spacing="0.6" >DR</text><rect x="794" y="382" width="34" height="19" rx="9.5" fill="#DDE5EA"/><text x="811.0" y="395.1" font-size="10" fill="#5A6B78" font-weight="800" text-anchor="middle" letter-spacing="0.6" >CR</text><text x="836" y="342" font-size="11.5" fill="#0B1F2A" font-weight="600" text-anchor="start" letter-spacing="0" >Unapplied Revenue</text><text x="836" y="390" font-size="11.5" fill="#0B1F2A" font-weight="600" text-anchor="start" letter-spacing="0" >Refund Expense</text><path d="M991 278.0 L1003 278.0" stroke="#C2CDD4" stroke-width="2" fill="none" marker-end="url(#ah-g)" stroke-linecap="round"/><defs><clipPath id="clip5"><rect x="1008" y="132" width="218" height="292" rx="16"/></clipPath></defs><rect x="1008" y="132" width="218" height="292" rx="16" fill="#FFFFFF"/><rect x="1008" y="132" width="218" height="6" fill="#B91C1C" clip-path="url(#clip5)"/><rect x="1008" y="132" width="218" height="292" rx="16" fill="none" stroke="#E3E9ED" stroke-width="1.5"/><circle cx="1042" cy="180" r="16" fill="#B91C1C"/><text x="1042" y="185" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0" >5</text><text x="1028" y="224" font-size="16" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.2" >Cut the refund</text><text x="1028" y="245" font-size="16" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.2" >check</text><text x="1028" y="274" font-size="12" fill="#8A9AA6" font-weight="400" text-anchor="start" letter-spacing="0" >Money physically leaves</text><rect x="1024" y="322" width="186" height="42" rx="8" fill="#F7F9FA"/><rect x="1024" y="370" width="186" height="42" rx="8" fill="#F7F9FA"/><rect x="1034" y="334" width="34" height="19" rx="9.5" fill="#DDE5EA"/><text x="1051.0" y="347.1" font-size="10" fill="#5A6B78" font-weight="800" text-anchor="middle" letter-spacing="0.6" >DR</text><rect x="1034" y="382" width="34" height="19" rx="9.5" fill="#DDE5EA"/><text x="1051.0" y="395.1" font-size="10" fill="#5A6B78" font-weight="800" text-anchor="middle" letter-spacing="0.6" >CR</text><text x="1076" y="342" font-size="11.5" fill="#0B1F2A" font-weight="600" text-anchor="start" letter-spacing="0" >Refund Expense</text><text x="1076" y="390" font-size="11.5" fill="#0B1F2A" font-weight="600" text-anchor="start" letter-spacing="0" >Cash</text><rect x="48" y="452" width="1184" height="60" rx="12" fill="#F7F9FA"/><rect x="48" y="452" width="5" height="60" rx="2.5" fill="#4338CA"/><text x="70" y="476" font-size="13.5" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="0" >Step 4 looks backwards — it is correct.</text><text x="70" y="496" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >On a cash basis there is no refund liability. Flagging a credit as refundable credits Refund Expense; cutting the check debits it back. The expense is only truly recognized when the money leaves.</text></svg>