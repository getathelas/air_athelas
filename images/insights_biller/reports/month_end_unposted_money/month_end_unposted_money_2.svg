<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="1280" height="620" fill="#FFFFFF"/><defs><marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#AFBDC6"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F766E"/></marker></defs><text x="48" y="58" font-size="25" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.3" >How money moves into — and out of — Unposted Money</text><text x="48" y="83" font-size="14" fill="#8A9AA6" font-weight="400" text-anchor="start" letter-spacing="0" >Cash enters on the deposit date. It leaves when Athelas applies the payment, on the date posted. Whatever has not crossed by month-end is your Unposted Money balance.</text><text x="48" y="128" font-size="11" fill="#8A9AA6" font-weight="700" text-anchor="start" letter-spacing="1.4" >1 · MONEY ARRIVES</text><text x="424" y="128" font-size="11" fill="#8A9AA6" font-weight="700" text-anchor="start" letter-spacing="1.4" >2 · MONEY WAITS</text><text x="876" y="128" font-size="11" fill="#8A9AA6" font-weight="700" text-anchor="start" letter-spacing="1.4" >3 · MONEY IS APPLIED</text><rect x="424" y="148" width="368" height="360" rx="18" fill="#FCEFD6" stroke="#B45309" stroke-width="1.5" stroke-dasharray="7 5"/><text x="450" y="192" font-size="17.5" fill="#B45309" font-weight="800" text-anchor="start" letter-spacing="0.8" >UNPOSTED MONEY</text><text x="450" y="214" font-size="12.5" fill="#8A6224" font-weight="500" text-anchor="start" letter-spacing="0" >The clearing account on your ledger</text><rect x="448" y="244" width="320" height="32" rx="8" fill="#FFFFFF" opacity="0.9"/><circle cx="466" cy="260" r="4" fill="#B45309"/><text x="482" y="265" font-size="13" fill="#6B4A18" font-weight="600" text-anchor="start" letter-spacing="0" >Deposits not yet matched to a check</text><rect x="448" y="286" width="320" height="32" rx="8" fill="#FFFFFF" opacity="0.9"/><circle cx="466" cy="302" r="4" fill="#B45309"/><text x="482" y="307" font-size="13" fill="#6B4A18" font-weight="600" text-anchor="start" letter-spacing="0" >Checks matched, not yet posted</text><rect x="448" y="328" width="320" height="32" rx="8" fill="#FFFFFF" opacity="0.9"/><circle cx="466" cy="344" r="4" fill="#B45309"/><text x="482" y="349" font-size="13" fill="#6B4A18" font-weight="600" text-anchor="start" letter-spacing="0" >Patient credits held or locked</text><rect x="448" y="370" width="320" height="32" rx="8" fill="#FFFFFF" opacity="0.9"/><circle cx="466" cy="386" r="4" fill="#B45309"/><text x="482" y="391" font-size="13" fill="#6B4A18" font-weight="600" text-anchor="start" letter-spacing="0" >Payer credits and forward balances</text><line x1="448" y1="442" x2="768" y2="442" stroke="#B45309" stroke-width="1" opacity="0.3"/><text x="450" y="466" font-size="12.5" fill="#8A6224" font-weight="600" text-anchor="start" letter-spacing="0" >The balance on the last day of the month is</text><text x="450" y="483" font-size="12.5" fill="#8A6224" font-weight="600" text-anchor="start" letter-spacing="0" >your reconciliation target.</text><defs><clipPath id="clip1"><rect x="48" y="220" width="292" height="88" rx="14"/></clipPath></defs><rect x="48" y="220" width="292" height="88" rx="14" fill="#FFFFFF"/><rect x="48" y="220" width="292" height="5" fill="#B45309" clip-path="url(#clip1)"/><rect x="48" y="220" width="292" height="88" rx="14" fill="none" stroke="#E3E9ED" stroke-width="1.5"/><text x="68" y="257" font-size="15.5" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="0" >Payer remittance cash</text><text x="68" y="278" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >EFT and check deposits from payers</text><path d="M352 264.0 L414 264.0" stroke="#AFBDC6" stroke-width="2" fill="none" marker-end="url(#ah-g)" stroke-linecap="round"/><defs><clipPath id="clip2"><rect x="48" y="348" width="292" height="88" rx="14"/></clipPath></defs><rect x="48" y="348" width="292" height="88" rx="14" fill="#FFFFFF"/><rect x="48" y="348" width="292" height="5" fill="#4338CA" clip-path="url(#clip2)"/><rect x="48" y="348" width="292" height="88" rx="14" fill="none" stroke="#E3E9ED" stroke-width="1.5"/><text x="68" y="385" font-size="15.5" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="0" >Patient payments</text><text x="68" y="406" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >Copays, balances, prepayments, product</text><text x="68" y="422" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >and program fees</text><path d="M352 392.0 L414 392.0" stroke="#AFBDC6" stroke-width="2" fill="none" marker-end="url(#ah-g)" stroke-linecap="round"/><defs><clipPath id="clip3"><rect x="876" y="168" width="356" height="88" rx="14"/></clipPath></defs><rect x="876" y="168" width="356" height="88" rx="14" fill="#FFFFFF"/><rect x="876" y="168" width="356" height="5" fill="#0F766E" clip-path="url(#clip3)"/><rect x="876" y="168" width="356" height="88" rx="14" fill="none" stroke="#E3E9ED" stroke-width="1.5"/><text x="896" y="203" font-size="15.5" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="0" >Applied Payments</text><text x="896" y="223" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >AR relieved on the encounter</text><text x="896" y="243" font-size="11.5" fill="#0F766E" font-weight="700" text-anchor="start" letter-spacing="0" >Encounter Revenue Activity</text><path d="M802 212.0 L864 212.0" stroke="#0F766E" stroke-width="2" fill="none" marker-end="url(#ah-t)" stroke-linecap="round"/><defs><clipPath id="clip4"><rect x="876" y="284" width="356" height="88" rx="14"/></clipPath></defs><rect x="876" y="284" width="356" height="88" rx="14" fill="#FFFFFF"/><rect x="876" y="284" width="356" height="5" fill="#7E22CE" clip-path="url(#clip4)"/><rect x="876" y="284" width="356" height="88" rx="14" fill="none" stroke="#E3E9ED" stroke-width="1.5"/><text x="896" y="319" font-size="15.5" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="0" >Miscellaneous Payments</text><text x="896" y="339" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >Non-claim money collected</text><text x="896" y="359" font-size="11.5" fill="#7E22CE" font-weight="700" text-anchor="start" letter-spacing="0" >Misc Revenue Activity + Provider Adjustments</text><path d="M802 328.0 L864 328.0" stroke="#0F766E" stroke-width="2" fill="none" marker-end="url(#ah-t)" stroke-linecap="round"/><defs><clipPath id="clip5"><rect x="876" y="400" width="356" height="88" rx="14"/></clipPath></defs><rect x="876" y="400" width="356" height="88" rx="14" fill="#FFFFFF"/><rect x="876" y="400" width="356" height="5" fill="#4338CA" clip-path="url(#clip5)"/><rect x="876" y="400" width="356" height="88" rx="14" fill="none" stroke="#E3E9ED" stroke-width="1.5"/><text x="896" y="435" font-size="15.5" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="0" >Patient Refund Liability</text><text x="896" y="455" font-size="12.5" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >Flexible credits you may owe back</text><text x="896" y="475" font-size="11.5" fill="#4338CA" font-weight="700" text-anchor="start" letter-spacing="0" >Patient Credits</text><path d="M802 444.0 L864 444.0" stroke="#0F766E" stroke-width="2" fill="none" marker-end="url(#ah-t)" stroke-linecap="round"/><rect x="164" y="524" width="180" height="28" rx="14" fill="#F7F9FA"/><text x="254" y="542" font-size="11.5" fill="#5A6B78" font-weight="700" text-anchor="middle" letter-spacing="0.8" >enters by DEPOSIT DATE</text><rect x="808" y="524" width="176" height="28" rx="14" fill="#F7F9FA"/><text x="896" y="542" font-size="11.5" fill="#5A6B78" font-weight="700" text-anchor="middle" letter-spacing="0.8" >leaves by DATE POSTED</text><rect x="48" y="572" width="1184" height="34" rx="10" fill="#FCF6EA"/><rect x="48" y="572" width="5" height="34" rx="2.5" fill="#B45309"/><text x="70" y="594" font-size="13" fill="#6B4A18" font-weight="500" text-anchor="start" letter-spacing="0" >Athelas will not have posted every payment by the time your month closes. That is expected — the unposted remainder is real cash, and it needs a home on your ledger.</text></svg>