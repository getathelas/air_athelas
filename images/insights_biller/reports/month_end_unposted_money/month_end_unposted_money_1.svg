<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="1280" height="580" fill="#FFFFFF"/><text x="48" y="58" font-size="25" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.3" >Why you need an Unposted Money account</text><text x="48" y="83" font-size="14" fill="#8A9AA6" font-weight="400" text-anchor="start" letter-spacing="0" >On a self-posted system, cash and posted payments agree at month-end. On a co-sourced platform they will not — and the difference has to live somewhere on your ledger.</text><rect x="48" y="104" width="588" height="430" rx="18" fill="#F7F9FA" stroke="#E3E9ED" stroke-width="1.5"/><rect x="76" y="130" width="250" height="28" rx="14.0" fill="#E4EAEE"/><text x="201.0" y="148.14" font-size="11.5" fill="#5A6B78" font-weight="800" text-anchor="middle" letter-spacing="1" >SELF-POSTED SYSTEM</text><text x="76" y="194" font-size="21" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.3" >Cash  =  Posted Payments</text><text x="76" y="220" font-size="12.8" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >Your team chases every deposit and posts it before the books</text><text x="76" y="238" font-size="12.8" fill="#5A6B78" font-weight="400" text-anchor="start" letter-spacing="0" >close, so cash and posted payments agree to the dollar.</text><line x1="76" y1="458" x2="608" y2="458" stroke="#C7D2D8" stroke-width="1.5"/><rect x="206" y="306.0" width="110" height="152.0" rx="6" fill="#DCF3E3" stroke="#15803D" stroke-width="1.5"/><text x="261.0" y="332.0" font-size="15" fill="#15803D" font-weight="800" text-anchor="middle" letter-spacing="0" >$100</text><text x="261.0" y="484" font-size="12.5" fill="#5A6B78" font-weight="600" text-anchor="middle" letter-spacing="0" >Cash in the bank</text><rect x="378" y="306.0" width="110" height="152.0" rx="6" fill="#D6F2EE" stroke="#0F766E" stroke-width="1.5"/><text x="433.0" y="332.0" font-size="15" fill="#0F766E" font-weight="800" text-anchor="middle" letter-spacing="0" >$100</text><text x="433.0" y="484" font-size="12.5" fill="#5A6B78" font-weight="600" text-anchor="middle" letter-spacing="0" >Posted payments</text><text x="342.0" y="512" font-size="13" fill="#5A6B78" font-weight="700" text-anchor="middle" letter-spacing="0" >Balanced — no clearing account required</text><rect x="664" y="104" width="588" height="430" rx="18" fill="#FEFAF3" stroke="#B45309" stroke-width="1.5"/><rect x="692" y="130" width="286" height="28" rx="14.0" fill="#B45309"/><text x="835.0" y="148.14" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="1" >CO-SOURCED ON ATHELAS</text><text x="692" y="194" font-size="21" fill="#0B1F2A" font-weight="700" text-anchor="start" letter-spacing="-0.3" >Cash  =  Posted  +  Unposted Money</text><text x="692" y="220" font-size="12.8" fill="#8A6224" font-weight="400" text-anchor="start" letter-spacing="0" >Athelas posts on a rolling basis. Remittances arrive late,</text><text x="692" y="238" font-size="12.8" fill="#8A6224" font-weight="400" text-anchor="start" letter-spacing="0" >deposits await matching, patient credits sit unapplied. Cash</text><text x="692" y="256" font-size="12.8" fill="#8A6224" font-weight="400" text-anchor="start" letter-spacing="0" >exceeds posted payments on the day you close.</text><line x1="692" y1="458" x2="1224" y2="458" stroke="#C7D2D8" stroke-width="1.5"/><rect x="756" y="306.0" width="110" height="152.0" rx="6" fill="#DCF3E3" stroke="#15803D" stroke-width="1.5"/><text x="811.0" y="332.0" font-size="15" fill="#15803D" font-weight="800" text-anchor="middle" letter-spacing="0" >$100</text><text x="811.0" y="484" font-size="12.5" fill="#5A6B78" font-weight="600" text-anchor="middle" letter-spacing="0" >Cash in the bank</text><rect x="918" y="345.52" width="110" height="112.48" rx="6" fill="#D6F2EE" stroke="#0F766E" stroke-width="1.5"/><text x="973.0" y="371.52" font-size="15" fill="#0F766E" font-weight="800" text-anchor="middle" letter-spacing="0" >$74</text><text x="973.0" y="484" font-size="12.5" fill="#5A6B78" font-weight="600" text-anchor="middle" letter-spacing="0" >Posted payments</text><rect x="918" y="306.0" width="110" height="39.52" rx="6" fill="#FCEFD6" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 4"/><text x="973" y="332.0" font-size="15" fill="#B45309" font-weight="800" text-anchor="middle" letter-spacing="0" >$26</text><path d="M1042 308.0 h12 v35.52 h-12" stroke="#B45309" stroke-width="2" fill="none"/><text x="1066" y="322.0" font-size="12" fill="#B45309" font-weight="800" text-anchor="start" letter-spacing="0.6" >UNPOSTED MONEY</text><text x="1066" y="342.0" font-size="12" fill="#8A6224" font-weight="500" text-anchor="start" letter-spacing="0" >Cash received, not yet</text><text x="1066" y="358.0" font-size="12" fill="#8A6224" font-weight="500" text-anchor="start" letter-spacing="0" >applied to a claim</text><text x="958.0" y="512" font-size="13" fill="#B45309" font-weight="700" text-anchor="middle" letter-spacing="0" >The gap is real cash — it needs an account</text></svg>